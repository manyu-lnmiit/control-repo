[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "injection-radar"
version = "0.1.0"
description = "Detect and sanitize prompt-injection attempts hiding in tool outputs, RAG documents, and web content before they reach an LLM's context window."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Abhimanyu" }]
keywords = ["llm", "agentic-ai", "prompt-injection", "security", "ai-agents"]
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.111,<1.0", "uvicorn[standard]>=0.30,<1.0", "pydantic>=2.7,<3.0"]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.5.0,<1.0",
    "httpx>=0.27,<1.0",
    "fastapi>=0.111,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
]

[project.scripts]
injection-radar = "injection_radar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
