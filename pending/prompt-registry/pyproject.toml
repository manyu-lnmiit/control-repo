[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-registry"
version = "0.1.0"
description = "Git-like version control, diffing, tagging, and safe A/B rollout for LLM prompt templates."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Abhimanyu" }]
keywords = ["llm", "prompt-engineering", "agentic-ai", "prompt-management", "developer-tools"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110,<1.0", "uvicorn[standard]>=0.29,<1.0", "pydantic>=2.5,<3.0"]
dev = ["pytest>=8.0,<9.0", "pytest-cov>=5.0,<6.0", "ruff>=0.5,<1.0"]

[project.scripts]
prompt-registry = "prompt_registry.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
