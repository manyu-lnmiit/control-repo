[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-workflow-graph"
version = "0.1.0"
description = "Composable DAG orchestration engine for multi-agent LLM workflows: nodes, conditional loops, and parallel fan-out/fan-in, with zero required dependencies."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Abhimanyu" }]
keywords = ["agentic-ai", "llm", "ai-agents", "workflow", "orchestration", "dag"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<6",
    "ruff>=0.5,<0.6",
    "mypy>=1.10,<2",
]

[project.scripts]
agentworkflow = "agentworkflow.cli:main"

[project.urls]
Homepage = "https://github.com/manyu-lnmiit/agent-workflow-graph"
Issues = "https://github.com/manyu-lnmiit/agent-workflow-graph/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
