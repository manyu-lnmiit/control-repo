[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-trace-lens"
version = "0.1.0"
description = "Lightweight distributed tracing, storage, and timeline visualization for multi-agent LLM systems."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Abhimanyu Sharma" }]
keywords = ["llm", "agents", "tracing", "observability", "orchestration"]
dependencies = [
    "fastapi>=0.111,<0.120",
    "uvicorn[standard]>=0.29,<0.35",
    "pydantic>=2.6,<3.0",
    "typer>=0.12,<0.16",
    "rich>=13.7,<14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<6.0",
    "httpx>=0.27,<0.28",
    "ruff>=0.5,<0.9",
]

[project.scripts]
agent-trace-lens = "agent_trace_lens.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_trace_lens = ["web/*.html"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
