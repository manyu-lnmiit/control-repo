[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-guardrail"
version = "0.1.0"
description = "Policy enforcement, cost budgeting, tracing and deterministic replay for LLM agent tool calls."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Abhimanyu" }]
keywords = ["llm", "agents", "agentic-ai", "guardrails", "observability", "tool-calling"]
dependencies = [
    "jsonschema>=4.21,<5",
    "PyYAML>=6.0,<7",
    "click>=8.1,<9",
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29,<1",
    "pydantic>=2.6,<3",
]

[project.scripts]
agent-guardrail = "agent_guardrail.cli:main"

[tool.setuptools.packages.find]
include = ["agent_guardrail*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
