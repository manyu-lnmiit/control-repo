# Example policy for agent_guardrail.
#
# `default_allowed: false` means any tool not explicitly listed under
# `tools:` is denied by default -- a safe default for agent deployments.

default_allowed: false

tools:
  search_web:
    allowed: true
    description: "Search the public web for a query string."
    max_calls_per_minute: 20
    max_cost_per_call: 0.002
    redact_output: true
    args_schema:
      type: object
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 500
      required: ["query"]
      additionalProperties: false

  read_file:
    allowed: true
    description: "Read a file from the local sandbox filesystem."
    max_calls_per_minute: 60
    max_cost_per_call: 0.0
    redact_output: false
    args_schema:
      type: object
      properties:
        path:
          type: string
          minLength: 1
      required: ["path"]
      additionalProperties: false

  send_email:
    allowed: false
    description: "Sending email is disabled by default; enable per-deployment."

  execute_shell:
    allowed: false
    description: "Arbitrary shell execution is never allowed by this policy."
