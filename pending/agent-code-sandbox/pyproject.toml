[build-system]
requires = ["setuptools>=68.0,<76.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-code-sandbox"
version = "0.1.0"
description = "A secure, dependency-light sandboxed execution engine for running LLM/agent-generated Python and shell snippets safely."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Abhimanyu" }
]
keywords = ["sandbox", "llm", "agents", "code-execution", "security", "ai-infrastructure"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Topic :: Software Development :: Libraries",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
api = [
    "fastapi>=0.100,<1.0",
    "uvicorn>=0.23,<1.0",
]

[project.urls]
Homepage = "https://github.com/manyu-lnmiit/agent-code-sandbox"
Repository = "https://github.com/manyu-lnmiit/agent-code-sandbox"
Issues = "https://github.com/manyu-lnmiit/agent-code-sandbox/issues"

[project.scripts]
agent-code-sandbox = "agent_code_sandbox.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_code_sandbox = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
