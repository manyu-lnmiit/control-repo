[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentflow-runtime"
version = "0.1.0"
description = "A durable execution runtime for multi-step LLM agent workflows: checkpointing, crash-safe resume, retries with backoff, and human-in-the-loop approval gates."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Abhimanyu Sharma" }]
keywords = [
    "agentic-ai",
    "llm-agents",
    "workflow-orchestration",
    "durable-execution",
    "human-in-the-loop",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<6",
    "ruff>=0.6,<1.0",
    "mypy>=1.10,<2",
]

[project.scripts]
agentflow = "agentflow.cli:main"

[tool.setuptools.packages.find]
include = ["agentflow*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
